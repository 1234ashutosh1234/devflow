name: DevFlow CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

# CI only reads source code; it does not need write access to the repository.
permissions:
  contents: read

# Avoid spending runner time on older commits when a newer commit arrives
# for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      # The current unit-test fixtures use isolated in-memory SQLite databases.
      # Keep the application import/smoke check independent of a live database.
      DATABASE_URL: sqlite:///./devflow_ci.db
      JWT_SECRET: ci-only-not-a-real-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      AI_REVIEW_PROVIDER: local
      GITHUB_API_URL: https://api.github.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend modules
        working-directory: backend
        run: python -m compileall -q app ai_reviewer tests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q --junitxml=junit.xml

      - name: Verify FastAPI application imports
        working-directory: backend
        run: |
          python -c "from app.main import app; print('FASTAPI APP: OK'); print('ROUTES:', len(app.routes))"

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-test-results
          path: backend/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
